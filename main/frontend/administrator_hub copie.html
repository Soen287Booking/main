            <a class="navbar-brand fw-bold" href="admin index.html">Campus Booking</a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="admin index.html">Main</a></li>
                    <li class="nav-item"><a class="nav-link" href="resources.html">Resources</a></li>

        </div>

    <main class="container mt-5 pt-5">
        <h1 class="text-center mb-4">Welcome, Admin 👨‍💼👩‍💼</h1>


        <div class="row justify-content-center">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Admin JS: Role-based access -->
    <script>
        // Simulate current user
        // In real application, get this from server/auth system
        const currentUser = {
            username: "youssef",
            role: "admin" // change to "user" to test non-admin
        };

        // Show Admin Hub link in navbar only for admins
        const adminLink = document.getElementById("admin-link");
        if (currentUser.role === "admin") {
            adminLink.style.display = "block";
        }

        // Protect Admin Hub page itself
        if (currentUser.role !== "admin") {
            alert("Access denied! Redirecting to main page.");
            window.location.href = "index.html";
        }
    </script>
