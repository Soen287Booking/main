<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Resources</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="administrator_hub copie.html">Admin Hub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link active" href="manage.html">Manage Resources</a></li>
        <li class="nav-item"><a class="nav-link" href="managebooking.html">Manage Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="stats.html">View Statistics</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mt-5 pt-5">
  <h1 class="text-center mb-4">Manage Resources</h1>

  <div class="card shadow-sm p-4">
    <h5>Add a new resource</h5>
    <form id="addResourceForm">
      <div class="mb-3">
        <label for="resourceName" class="form-label">Resource Name</label>
        <input type="text" class="form-control" id="resourceName" placeholder="e.g., Study Room 101">
      </div>

      <div class="mb-3">
        <label for="resourceType" class="form-label">Resource Type</label>
        <select class="form-select" id="resourceType">
          <option value="study">Study Room</option>
          <option value="lab">Lab</option>
          <option value="sports">Sports Space</option>
          <option value="equipment">Specialized Equipment</option>
          <option value="software">Software Seat</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Working Hours</label>
        <input type="text" class="form-control" id="workingHours" placeholder="e.g. 9 AM - 5 PM">
      </div>

      <div class="mb-3">
        <label class="form-label">Blackout Dates (comma-separated)</label>
        <input type="text" class="form-control" id="blackoutDates" placeholder="e.g., 2025-11-01, 2025-12-25">
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="maintenanceMode">
        <label class="form-check-label" for="maintenanceMode">
          Temporarily Block Resource (Maintenance)
        </label>
      </div>

      <button type="submit" class="btn btn-primary">Add Resource</button>
    </form>
  </div>

  
  <div class="card shadow-sm p-4 mt-4">
    <h5>Existing Resources</h5>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Working Hours</th>
            <th>Maintenance</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="resourceTableBody">
          <tr>
            <td> Room </td>
            <td>Study Room</td>
            <td>HH - HH</td>
            <td><input type="checkbox" class="maintenance-toggle"></td>
            <td>
              <button class="btn btn-sm btn-secondary edit-btn">Edit</button>
              <button class="btn btn-sm btn-danger delete-btn">Delete</button>
            </td>
          </tr>
          
        </tbody>
      </table>
    </div>
  </div>

</main>

<footer class="footer border-top mt-5 py-3">
  <div class="container text-center">
    <p>© 2025 Campus Booking | Concordia University Project</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // (no storage)
  document.getElementById('addResourceForm').addEventListener('submit', function(e){
    e.preventDefault();
    alert('Resource added successfully!');
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => alert('Edited resource ✏️ !'));
  });

  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => alert('Deleted resource 🗑️ !'));
  });

  document.querySelectorAll('.maintenance-toggle').forEach(chk => {
    chk.addEventListener('change', () => alert('⚠️ Maintenance status changed!'));
  });
</script>
</body>
</html>
